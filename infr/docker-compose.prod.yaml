services:
  backend:
    image: hvorostovsa/gastro-map-analytics-backend:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    image: hvorostovsa/gastro-map-analytics-frontend:latest
    ports:
      - "80:80"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - home/semen/gastro-prod/gastro-map-analytics/infr # костыль пока хз что с ним сделать


volumes:
  pgdata:
