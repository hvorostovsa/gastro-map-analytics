services:
  backend:
    build: ../backend
    container_name: backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/db-big-data
    ports:
      - "8000:8000"

  db:
    image: postgis/postgis:15-3.4
    container_name: db
    command: postgres -c synchronous_commit=off
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db-big-data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d

  loader:
    build: ../backend
    container_name: loader
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/db-big-data
    volumes:
      - ../data:/data
    command: ["python", "-u", "../data/main.py", "--all, "--path", "/data"]

volumes:
  pgdata:
