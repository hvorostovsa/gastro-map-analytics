<!DOCTYPE html>
<html>
<head>
    <title>Geo Heatmap</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
const map = L.map('map').setView([34.05, -118.25], 12);

// Base tiles (stable provider)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap & CARTO'
}).addTo(map);

let heatLayer = null;

// debounce helper (prevents spam API calls)
function debounce(fn, delay) {
    let t;
    return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
}

function loadHeatmap() {
    const bounds = map.getBounds();

    const bbox = [
        bounds.getSouth(),
        bounds.getWest(),
        bounds.getNorth(),
        bounds.getEast()
    ].join(",");

    const zoom = map.getZoom();

    fetch(`http://127.0.0.1:8000/geo/heatmap?bbox=${bbox}&zoom=${zoom}`)
        .then(r => r.json())
        .then(data => {

            const heatData = data.map(p => [
                Number(p.lat),
                Number(p.lon),
                Number(p.intensity)
            ]);

            if (heatLayer) {
                map.removeLayer(heatLayer);
            }

            heatLayer = L.heatLayer(heatData, {
                radius: 35,
                blur: 20,
                maxZoom: 17,
                minOpacity: 0.4
            }).addTo(map);
        });
}

const debouncedLoad = debounce(loadHeatmap, 300);

map.on("moveend", debouncedLoad);
map.on("zoomend", debouncedLoad);

// initial load
loadHeatmap();

</script>

</body>
</html>
