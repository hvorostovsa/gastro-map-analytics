name: Deploy Prod

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: check CI status
        run: |
          STATUS=$(gh run list --workflow "Build & Push Prod Images" --branch main --limit 1 --json conclusion -q '.[0].conclusion')
          if [ "$STATUS" != "success" ]; then
            echo "CI failed or not finished. Deployment blocked."
            exit 1
          fi      

      - name: checkout
        uses: actions/checkout@v4

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: pull & restart prod
        working-directory: ./infr
        run: |
          docker compose -f docker-compose.prod.yaml pull
          docker compose -f docker-compose.prod.yaml up -d
